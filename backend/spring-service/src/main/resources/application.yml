spring:
  application:
    name: codesentinel
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codesentinel}
    username: ${MYSQL_USER:codesentinel}
    password: ${MYSQL_PASSWORD:codesentinel_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SPRING_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

review:
  task:
    max-retries: ${REVIEW_TASK_MAX_RETRIES:3}

github:
  app:
    app-id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_PRIVATE_KEY:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    installation-id: ${GITHUB_INSTALLATION_ID:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}